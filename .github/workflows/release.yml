# Publishes a GitHub release when a version tag is pushed.
#
# The notes are the tag's CHANGELOG.md section followed by the commit list
# rendered by git-cliff (cliff.toml) from the last published release; the
# macOS app is built, tested, signed with Developer ID, notarized and attached
# as a DMG. 0.x versions are published as alpha pre-releases.
#
# Secrets: MACOS_CERTIFICATE (base64 .p12 of the Developer ID Application
# certificate and its key), MACOS_CERTIFICATE_PASSWORD, APPLE_ID and
# APPLE_APP_PASSWORD (an app-specific password for notarytool).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      SIGNING_IDENTITY: "Developer ID Application: Ismail BAHTIYAR (6YXSJ4BF33)"
      APPLE_TEAM_ID: 6YXSJ4BF33
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout replaces the annotated tag with a lightweight one;
      # fetch it again so its subject can title the release.
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Check the tag matches the CMake project version
        run: |
          project_version=$(sed -nE 's/^project\(Resamper VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "v$project_version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match CMakeLists.txt version $project_version"
            exit 1
          fi
          {
            echo "VERSION=$project_version"
            echo "DMG=Resamper-$project_version-macOS.dmg"
          } >> "$GITHUB_ENV"

      - name: Extract the CHANGELOG section
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > changelog-section.md
          if ! grep -q '[^[:space:]]' changelog-section.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Render the commit list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew install git-cliff
          # From the last published release, not the previous tag: a tag whose release
          # failed would otherwise drop its commits from every later release's notes.
          prev=$(gh release list --exclude-drafts --json tagName \
            --jq "map(select(.tagName != \"$TAG\")) | .[0].tagName // empty")
          if [ -n "$prev" ]; then
            git cliff "$prev..$TAG" --output commits.md
          else
            git cliff --latest --output commits.md
          fi

      - name: Fetch dependencies
        run: |
          git submodule update --init external/gin external/melatonin_inspector external/tracktion_engine
          git -C external/tracktion_engine config submodule.modules/juce.url https://github.com/juce-framework/JUCE.git
          git -C external/tracktion_engine submodule update --init modules/juce
          brew install ninja

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --target Resamper ResamperTests

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

      # The hardened runtime's entitlements come from juce_add_gui_app in
      # CMakeLists.txt, which writes them at configure time.
      - name: Sign and package
        run: |
          app=build/Resamper_artefacts/Release/Resamper.app
          codesign --force --options runtime --timestamp \
            --entitlements build/Resamper_artefacts/JuceLibraryCode/Resamper.entitlements \
            --sign "$SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

          mkdir dmg
          ditto "$app" dmg/Resamper.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Resamper -srcfolder dmg -fs HFS+ -format UDZO "$DMG"
          codesign --timestamp --sign "$SIGNING_IDENTITY" "$DMG"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "$DMG" --wait --output-format json \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" > notarization.json
          cat notarization.json
          if [ "$(jq -r .status notarization.json)" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id notarization.json)" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat changelog-section.md
            echo
            echo "### Download"
            echo
            echo "Open \`$DMG\` (Apple Silicon) and drag Resamper to Applications."
            echo
            echo "<details><summary>All changes</summary>"
            echo
            cat commits.md
            echo
            echo "</details>"
          } > notes.md

          title=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')
          flags=()
          case "$VERSION" in
            0.*) title="$title (alpha)"; flags+=(--prerelease) ;;
          esac

          gh release create "$TAG" "$DMG" \
            --verify-tag --title "${title:-$TAG}" --notes-file notes.md "${flags[@]}"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
