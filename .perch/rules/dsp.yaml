- name: realtime-safe-audio-thread
  each: method
  where: Source/Engine/**/*.{cpp,h}
  min: 70
  ensure: >-
    If this method runs on the audio thread (processBlock, applyToBuffer,
    getNextAudioBlock, renderNextBlock, prepareForNextBlock, an audio-device
    callback, or anything only they call), it does not allocate (new,
    make_unique, push_back or resize on a growing container, building a
    juce::String), lock a mutex or CriticalSection, wait, log, touch files, read
    or write a ValueTree, or call into the message thread. Buffers are sized in
    prepare/initialise and reused; data crosses threads through atomics or
    lock-free FIFOs. A method that runs on the message thread — including one
    that reads peaks from a LevelMeasurer::Client — passes.
- name: dsp-sample-rate-from-prepare
  each: method
  where: Source/Engine/**/*.{cpp,h}
  min: 70
  ensure: >-
    Filter coefficients, envelope/ramp step sizes, delay lengths and any
    time-to-samples conversion are computed from the sample rate the engine
    hands over in prepare/initialise (or the current Edit/device rate). A
    coefficient computed in a constructor before the rate is known, or a rate
    cached once and not refreshed when prepare is called again, breaks this. A
    method that does no time or frequency maths passes. Literal sample rates are
    checked by Semgrep (no-hardcoded-sample-rate), not here.
- name: dsp-gain-units
  each: method
  where: Source/**/*.{cpp,h}
  min: 70
  ensure: >-
    Every level value is used in the unit it holds: decibels, linear amplitude
    gain, power and fader position (0..1) are not mixed. Passing dB where linear
    gain is expected (or the reverse), adding or multiplying dB with linear
    values, treating a fader position as dB, or converting amplitude with
    10·log10 (or power with 20·log10) breaks this. Correct conversions pass
    however they are written (juce::Decibels, the te:: volume/fader helpers, or
    explicit 20·log10 for amplitude and 10·log10 for power). A method with no
    level values passes.
- name: dsp-smoothed-parameter-changes
  each: method
  where: Source/Engine/**/*.{cpp,h}
  ensure: >-
    When this method applies a gain, pan, cutoff or other continuously-changing
    parameter to audio samples, the change is ramped (juce::SmoothedValue,
    applyGainRamp, or a per-sample interpolation) rather than jumping once per
    block, so it does not zip or click. A method that does not write audio
    samples passes.
  min: 70
